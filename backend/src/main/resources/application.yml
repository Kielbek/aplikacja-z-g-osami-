server:
  port: 8080

spring:
  application:
    name: voicecraft-backend
  datasource:
    url: jdbc:h2:file:${voicecraft.data-dir}/db/voicecraft;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

voicecraft:
  data-dir: ${VOICECRAFT_DATA_DIR:./data}
  cors-origins: ${VOICECRAFT_CORS:http://localhost:4200}
  engine:
    url: ${ENGINE_URL:http://localhost:8808}
    connect-timeout: 3s
    read-timeout: 180s
  seed-demo-data: true
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
