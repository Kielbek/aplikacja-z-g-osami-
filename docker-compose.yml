# Narrivy — pełny stos: PostgreSQL, silnik TTS, backend, frontend.
# Nagrania domyślnie na wolumenie backendu (STORAGE_TYPE=local). Produkcyjnie: STORAGE_TYPE=s3 + S3_* (AWS, R2, B2…).
#
#   cp .env.example .env        # uzupełnij sekrety
#   docker compose up --build   # http://localhost:4200
#
# Silnik VoxCPM2 na GPU: WITH_VOXCPM=true ENGINE_MODE=voxcpm2 + odkomentuj sekcję "deploy" (wymaga NVIDIA Container Toolkit).
# Bez GPU: ENGINE_MODE=piper — lekki silnik na CPU (prawdziwa mowa z gotowych głosów, bez projektowania i klonowania).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voicecraft
      POSTGRES_USER: voicecraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicecraft"]
      interval: 5s
      retries: 10

  tts-engine:
    build:
      context: ./tts-engine
      args:
        WITH_VOXCPM: ${WITH_VOXCPM:-false}
    environment:
      ENGINE_MODE: ${ENGINE_MODE:-auto}
      VOXCPM_MODEL_ID: ${VOXCPM_MODEL_ID:-openbmb/VoxCPM2}
      ENGINE_CORS: http://backend:8080
    volumes:
      - engine-data:/data
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/voicecraft
      DATABASE_USER: voicecraft
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Ustaw JWT_SECRET (min. 32 znaki) w .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      CLEANUP_CRON: ${CLEANUP_CRON:-0 30 3 * * *}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4200}
      VOICECRAFT_CORS: ${PUBLIC_URL:-http://localhost:4200}
      # Silnik na zewnętrznym GPU: ENGINE_URL=https://… i ENGINE_API_KEY w .env
      ENGINE_URL: ${ENGINE_URL:-http://tts-engine:8808}
      # Nagrania wzorcowe (Master Prompt) i gotowe próbki 30 języków — katalog ./voices (zob. voices/README.md)
      VOICES_PROMPTS_DIR: /voices
      VOICES_SAMPLES_DIR: /voices/samples
      PREGENERATE_SAMPLES: ${PREGENERATE_SAMPLES:-false}
      ENGINE_API_KEY: ${ENGINE_API_KEY:-}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-false}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_BUCKET: ${S3_BUCKET:-voicecraft-audio}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
      STRIPE_PRICE_STARTER_YEARLY: ${STRIPE_PRICE_STARTER_YEARLY:-}
      STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY:-}
      STRIPE_PRICE_BUSINESS_YEARLY: ${STRIPE_PRICE_BUSINESS_YEARLY:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Narrivy <no-reply@example.com>}
      # Konto demo i darmowa zmiana planu — tylko do lokalnych testów (w prod domyślnie wyłączone)
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DEMO_PLAN_SWITCH: ${DEMO_PLAN_SWITCH:-false}
    volumes:
      - backend-data:/data
      # :z — etykieta SELinux (Fedora); bez niej kontener nie odczyta katalogu
      - ./voices:/voices:z
    depends_on:
      postgres:
        condition: service_healthy
      tts-engine:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend

volumes:
  pg-data:
  engine-data:
  backend-data:
