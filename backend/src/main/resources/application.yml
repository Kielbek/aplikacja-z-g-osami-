server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: voicecraft-backend
  datasource:
    # Domyślnie H2 (plik lokalny). Produkcja: profil "prod" + PostgreSQL (zob. application-prod.yml)
    url: ${DATABASE_URL:jdbc:h2:file:${voicecraft.data-dir}/db/voicecraft;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  # SMTP: ustaw SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
  # (bez SPRING_MAIL_HOST e-maile trafiają do logów — tylko środowisko deweloperskie)

voicecraft:
  data-dir: ${VOICECRAFT_DATA_DIR:./data}
  cors-origins: ${VOICECRAFT_CORS:http://localhost:4200}
  public-url: ${PUBLIC_URL:http://localhost:4200}
  mail-from: ${MAIL_FROM:VoiceCraft AI <no-reply@voicecraft.local>}
  engine:
    url: ${ENGINE_URL:http://localhost:8808}
    api-key: ${ENGINE_API_KEY:}
    connect-timeout: 3s
    read-timeout: 180s
  seed-demo-data: ${SEED_DEMO_DATA:true}
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    jwt-secret: ${JWT_SECRET:}
    session-ttl: ${SESSION_TTL:14d}
    cookie-secure: ${COOKIE_SECURE:false}
    # Generowanie i klonowanie dopiero po potwierdzeniu adresu e-mail (bez SMTP link trafia do logów)
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:true}
  storage:
    type: ${STORAGE_TYPE:local}
    s3:
      bucket: ${S3_BUCKET:voicecraft-audio}
      region: ${S3_REGION:eu-central-1}
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style: ${S3_PATH_STYLE:false}
  cleanup:
    # Nocne sprzątanie: wygasła historia (wg planu), osierocone pliki audio, wygasłe tokeny
    cron: ${CLEANUP_CRON:0 30 3 * * *}
  billing:
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    prices:
      STARTER: ${STRIPE_PRICE_STARTER:}
      PRO: ${STRIPE_PRICE_PRO:}
      BUSINESS: ${STRIPE_PRICE_BUSINESS:}
    demo-plan-switch: ${DEMO_PLAN_SWITCH:true}
